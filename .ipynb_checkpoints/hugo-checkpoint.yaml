  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.png"
    content:  "I’m a physics student working in stellar astrophysics—mostly circling around questions of how stars are born, live, and eventually fall apart in ways that somehow still feel orderly. Some days I’m thinking about how a star holds itself together for millions of years before collapsing, and other days I’m just trying to get the equations to behave on paper.\n\nI grew up in Kolkata, where everything feels slightly too full and slightly too alive. I think that’s where my habit of looking twice comes from—at people waiting at crossings, light hitting old walls, the small chaos of it all.\n\nI usually carry a camera around with me. Not always with a plan—just because sometimes something catches my eye and I don’t want to trust my memory with it.\n\nThis space is just a collection of those moments, and the questions behind them."

